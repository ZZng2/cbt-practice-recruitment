<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CBT 체험 신청</title>
<style>body{font:16px/1.7 -apple-system,BlinkMacSystemFont,sans-serif;color:#29262a;background:#faf8f6;margin:0;padding:12vh 24px}main{max-width:480px;margin:auto}h1{font-size:28px}small{display:block;color:#716b70}a{color:inherit}</style>
<main><h1 id="status">신청서로 이동 중이에요.</h1><p>잠시만 기다려주세요···</p><small>수집자: 김원종 · 방문 경로·임의 번호 집계 · 2026.12.20까지 파기<br>문의·동의 철회: 010-5612-9902</small><p id="fallback" hidden>자동 이동이 어렵다면 <a id="formLink">신청서로 이동</a>해 주세요.</p><noscript>자동 이동을 위해 자바스크립트가 필요해요. <a href="https://docs.google.com/forms/d/1CHo5l_2gsRPZj1oPaDA9kUg1DWj8MCRaJ-Ehhn3KD0g/viewform">신청서로 이동</a></noscript></main>
<script src="config.js"></script><script>
(()=>{'use strict';
const config=window.CBT_CONFIG,params=new URLSearchParams(location.search),allowed=['instagram','instagram_story','threads','x','dc_repeat','dc_socialphobia','dc_nervous','dc_adhd','referral','direct'];
const source=allowed.includes(params.get('s'))?params.get('s'):'direct',fallback=document.getElementById('fallback');
document.getElementById('formLink').href=config.formUrl;
if(!config.endpoint){document.getElementById('status').textContent='집계 연결 전 검토본입니다.';fallback.hidden=false;return;}
let visitor;const qaOverride=params.get('qa_visitor');if(qaOverride&&/^[a-f0-9-]{36}$/i.test(qaOverride)){visitor=qaOverride;}else try{const saved=JSON.parse(localStorage.getItem('cbt-recruit-v1')||'null');visitor=saved&&saved.expires>Date.now()?saved.id:crypto.randomUUID();localStorage.setItem('cbt-recruit-v1',JSON.stringify({id:visitor,expires:Date.parse('2026-12-20T23:59:59+09:00')}));}catch{visitor=crypto.randomUUID();}
let done=false;const go=url=>{if(done)return;done=true;try{location.replace(url);}catch{fallback.hidden=false;}};
const timer=setTimeout(()=>go(config.formUrl),8000),callback='cbt_'+crypto.randomUUID().replace(/-/g,'');
window[callback]=data=>{clearTimeout(timer);delete window[callback];const u=data&&data.ok?data.url:'';go(/^https:\/\/docs\.google\.com\/forms\//.test(u)?u:config.formUrl);};
const script=document.createElement('script'),url=new URL(config.endpoint);url.searchParams.set('source',source);url.searchParams.set('visitor',visitor);url.searchParams.set('callback',callback);script.src=url.href;script.onerror=()=>{clearTimeout(timer);go(config.formUrl);};document.head.appendChild(script);
})();</script></html>
